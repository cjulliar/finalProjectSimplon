version: '3.8'

services:
  # Service principal Python
  app:
    build: 
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - ./src:/app/src
      - ./docs:/app/docs
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=bankreports
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - db

  # Base de données PostgreSQL
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=bankreports
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"

  # API FastAPI
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=bankreports
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - USE_POSTGRES=true
      - API_SECRET_KEY=secret-key-change-in-production
      - API_ALGORITHM=HS256
      - API_ACCESS_TOKEN_EXPIRE_MINUTES=30
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - ADMIN_EMAIL=admin@example.com
      - LLM_API_KEY=dummy-openai-key
      - HUGGINGFACE_API_KEY=dummy-huggingface-key
      - USE_HUGGINGFACE=false
      - USE_OPENAI=false
      - USE_FALLBACK_MODE=true
    depends_on:
      - db

  # Frontend Django
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app/frontend
      - ./frontend/static:/app/frontend/static
      - ./frontend/media:/app/frontend/media
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-change-in-production
      - API_URL=http://api:8000
      - API_SECRET_KEY=secret-key-change-in-production
      - DATABASE_URL=sqlite:///app/frontend/db.sqlite3
    depends_on:
      - api

  # Monitoring Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    volumes:
      - ./docker/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"

  # Dashboard Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: 